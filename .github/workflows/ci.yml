name: ci
on: [push, pull_request]

# 最小权限：CI 只读（显式声明，不依赖仓库默认值）
permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（SHA 固定；dependabot 周更）
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5（SHA 固定；dependabot 周更）
        with:
          go-version: '1.26'
      - name: 取解释器与工具链
        run: |
          # 钉主仓**版本 tag**（不再跟 main）：主仓变更不再连坐本仓 CI；升级时同步改这里
          git clone --depth 1 --branch v2.0.0 https://github.com/QuarkLangCommunity/QuarkLangQkc.git /tmp/qkc-repo
          cd /tmp/qkc-repo && go build -o /tmp/quark main.go
          git clone --depth 1 https://github.com/QuarkLangCommunity/QuarkLangQkfmt.git /tmp/qkfmt-repo
          cd /tmp/qkfmt-repo && go build -o /tmp/qkfmt .

          # 测试依赖的官方库（钉 commit：上游变动不影响本仓 CI）
          git clone --depth 1 https://github.com/QuarkLangCommunity/QuarkLangLibs-Json.git /tmp/json-lib
          git -C /tmp/json-lib fetch -q --depth 1 origin a4f9f41f959d2bfdd09fac287eb53cf68b3af49d && git -C /tmp/json-lib checkout -q FETCH_HEAD
          git clone --depth 1 https://github.com/QuarkLangCommunity/QuarkLangLibs-Style.git /tmp/style-lib
          git -C /tmp/style-lib fetch -q --depth 1 origin b4ea55940ce6dac70c3f1675490614df88d01240 && git -C /tmp/style-lib checkout -q FETCH_HEAD
      - name: 库测试
        env:
          # 测试依赖：json.qk / style.qk（CI 里没有本地兄弟目录，必须显式给路径）
          JSON_LIB: /tmp/json-lib/json.qk
          STYLE_LIB: /tmp/style-lib/style.qk
        run: |
          if [ -x tests/run.sh ]; then QUARK=/tmp/quark ./tests/run.sh; fi
      - name: 格式检查（提示，不阻断）
        run: |
          /tmp/qkfmt -l $(git ls-files '*.qk' | head -50) || true
